<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/archivelogonobg.png" />
    <title>Alt Art Archive</title>
    
    <!-- Primary Meta Tags -->
    <meta name="title" content="Alt Art Archive" />
    <meta name="description" content="Estonia's up-and-coming Pokémon TCG collector & vendor. Connecting collectors, one show at a time." />

    <!-- Open Graph / Facebook / Discord -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.altartarchive.com/" />
    <meta property="og:title" content="Alt Art Archive" />
    <meta property="og:description" content="Estonia's up-and-coming Pokémon TCG collector & vendor. Connecting collectors, one show at a time." />
    <meta property="og:image" content="https://www.altartarchive.com/logo.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://www.altartarchive.com/" />
    <meta property="twitter:title" content="Alt Art Archive" />
    <meta property="twitter:description" content="Estonia's up-and-coming Pokémon TCG collector & vendor. Connecting collectors, one show at a time." />
    <meta property="twitter:image" content="https://www.altartarchive.com/logo.png" />

    <style>
      #root {
        height: 100%;
        width: 100%;
      }
    </style>
    <script>
      (function() {
        try {
          // Store original fetch
          const originalFetch = window.fetch;
          
          // Check if fetch is already defined and its descriptor
          const descriptor = Object.getOwnPropertyDescriptor(window, 'fetch');
          
          // If it's configurable or doesn't exist yet, we can protect it
          if (!descriptor || descriptor.configurable) {
            Object.defineProperty(window, 'fetch', {
              get: function() {
                return originalFetch;
              },
              set: function(val) {
                console.warn('Blocked attempt to overwrite window.fetch');
                // We just ignore the set to prevent the error
              },
              configurable: true,
              enumerable: true
            });
          }
        } catch (e) {
          // Fail silently if we can't redefine fetch
          console.warn('Fetch protection could not be initialized:', e);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
